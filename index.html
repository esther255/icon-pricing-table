
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SixCode Academy — Membership Plans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>SixCode Academy — Membership Plans</h1>

    <table class="membership-table">
      <thead>
        <tr>
          <th scope="col">Plan</th>
          <th scope="col">Price / month</th>
          <th scope="col">Mentor Support</th>
          <th scope="col">Included</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td class="plan-name">Basic</td>
          <td class="price">$19</td>
          <td>Community only</td>
          <td class="included">
            <svg class="check-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
              <path d="M5 12l4 4L19 6" />
            </svg>
          </td>
        </tr>

        <tr>
          <td class="plan-name">Standard</td>
          <td class="price">$49</td>
          <td>Weekly check-in</td>
          <td class="included">
            <svg class="check-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
              <path d="M5 12l4 4L19 6" />
            </svg>
          </td>
        </tr>

        <tr>
          <td class="plan-name">Premium</td>
          <td class="price">$99</td>
          <td>Daily 1:1 mentor</td>
          <td class="included">
            <svg class="check-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
              <path d="M5 12l4 4L19 6" />
            </svg>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
